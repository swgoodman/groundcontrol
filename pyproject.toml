[project]
name = "groundcheck"
version = "0.0.1"
description = "A calibrated groundedness scorer and pluggable eval harness for RAG faithfulness and injection detection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "swgoodman" }]
keywords = ["nlp", "rag", "faithfulness", "hallucination", "prompt-injection", "evaluation"]

dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Pulling torch/transformers is heavy; keep the core import-light so tests and the
# metrics module run anywhere, including a bare CI container.
scorers = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=3.0",
]
serving = ["gradio>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: run them with `uv run pytest -m network`.
addopts = "-q -m 'not network'"
markers = ["network: hits the HuggingFace Hub; deselected by default"]
